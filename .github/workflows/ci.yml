name: CI

on:
  pull_request:
  push:
    branches: [main]
  repository_dispatch:
    types: [aegis-autonomous-delivery]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify-compatibility:
    name: Classify legacy compatibility scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      taskmaster: ${{ steps.scope.outputs.taskmaster }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.client_payload.merge_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Classify Taskmaster compatibility scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          required=true
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
            if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
              '.taskmaster/**' \
              'taskmaster-toolchain.json' \
              'aegis_foundation/taskmaster_toolchain.py' \
              'aegis_foundation/reconcile*.py' \
              'scripts/_aegis_installer.py' \
              'scripts/aegis-ci-taskmaster-compatibility' \
              'aegis_foundation/assets/scripts/_aegis_installer.py' \
              'tests/meta_workflow_guard/test_aegis_reconcile_*' \
              '.github/workflows/ci.yml' \
              'pyproject.toml' \
              'uv.lock'; then
              required=false
            fi
          fi
          echo "taskmaster=$required" >> "$GITHUB_OUTPUT"

  python-tests:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.client_payload.merge_sha || github.sha }}
          persist-credentials: false

      - name: Bind repository-dispatch branch identity
        if: github.event_name == 'repository_dispatch'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          MERGE_SHA: ${{ github.event.client_payload.merge_sha }}
        run: |
          set -euo pipefail
          [[ "$DEFAULT_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]]
          [[ "$MERGE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git switch -C "$DEFAULT_BRANCH" "$MERGE_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.6"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install shell integration test dependency
        run: |
          if ! command -v zsh >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends zsh
          fi

      - name: Sync locked project and test dependencies
        run: uv sync --locked --all-groups

      - name: Run pytest
        run: |
          mkdir -p reports/ci
          set -o pipefail
          # Taskmaster-backed compatibility tests skip here and run in the conditional job.
          PYTHONDONTWRITEBYTECODE=1 uv run --frozen --no-sync python -m pytest \
            -n auto --dist loadgroup \
            | tee "reports/ci/pytest-python-${{ matrix.python-version }}.txt"

      - name: Upload pytest artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: ci-pytest-python-${{ matrix.python-version }}
          path: |
            reports/ci/

  legacy-taskmaster-compatibility:
    name: Legacy Taskmaster compatibility
    needs: classify-compatibility
    if: needs.classify-compatibility.outputs.taskmaster == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      UV_PYTHON: "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.client_payload.merge_sha || github.sha }}
          persist-credentials: false

      - name: Bind repository-dispatch branch identity
        if: github.event_name == 'repository_dispatch'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          MERGE_SHA: ${{ github.event.client_payload.merge_sha }}
        run: |
          set -euo pipefail
          [[ "$DEFAULT_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]]
          [[ "$MERGE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git switch -C "$DEFAULT_BRANCH" "$MERGE_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.6"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Node for Taskmaster CLI
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: "22"

      - name: Sync locked project and test dependencies
        run: uv sync --locked --all-groups

      - name: Provision pinned Taskmaster CLI
        run: |
          mkdir -p reports/ci
          TASKMASTER_INSTALL_SPEC="$(uv run --frozen --no-sync python -m aegis_foundation.taskmaster_toolchain install-spec)"
          npm install -g "$TASKMASTER_INSTALL_SPEC"
          uv run --frozen --no-sync python -m aegis_foundation.taskmaster_toolchain \
            capture --output reports/ci/taskmaster-toolchain.json
          task-master --version

      - name: Run Taskmaster health
        run: uv run --frozen --no-sync python scripts/codex-task taskmaster health

      - name: Capture reconcile shadow context proof
        run: uv run --frozen --no-sync python scripts/aegis-ci-taskmaster-compatibility

      - name: Capture reconcile shadow cascade validation
        run: test -s reports/ci/reconcile-shadow-cascade-validation.json

      - name: Capture post-merge reconcile shadow accumulation
        run: test -s "${{ runner.temp }}/aegis-shadow/reconcile-shadow-accumulation.json"

      - name: Capture reconcile shadow precision corpus
        run: test -s "${{ runner.temp }}/aegis-shadow/reconcile-shadow-precision-corpus.json"

      - name: Run legacy Taskmaster compatibility tests
        run: |
          PYTHONDONTWRITEBYTECODE=1 uv run --frozen --no-sync python -m pytest \
            -n auto --dist loadgroup \
            tests/meta_workflow_guard/test_aegis_reconcile_shadow_apply.py \
            tests/meta_workflow_guard/test_aegis_reconcile_shadow_precision_corpus.py \
            tests/meta_workflow_guard/test_aegis_reconcile_mutation_rollback_contract.py \
            tests/meta_workflow_guard/test_aegis_reconcile_apply_write_apparatus.py

      - name: Upload Taskmaster compatibility artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: ci-legacy-taskmaster-compatibility
          path: |
            reports/ci/
            ${{ runner.temp }}/aegis-shadow/
