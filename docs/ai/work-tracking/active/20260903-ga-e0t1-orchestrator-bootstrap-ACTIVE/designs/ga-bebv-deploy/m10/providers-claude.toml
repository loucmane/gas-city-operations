[providers.claude]
base = "builtin:claude"
options_schema_merge = "replace"
ready_delay_ms = 0
[providers.claude.option_defaults]
model = "opus-5-5"
permission_mode = "auto-edit"
effort = "max"
worktree_access = "none"

[[providers.claude.options_schema]]
key = "permission_mode"
label = "Permission Mode"
type = "select"
default = "auto-edit"

[[providers.claude.options_schema.choices]]
value = "auto-edit"
label = "Attend approvals"
flag_args = ["--permission-mode", "auto"]

[[providers.claude.options_schema.choices]]
value = "full-auto"
label = "Fail instead of asking"
flag_args = ["--permission-mode", "dontAsk"]

[[providers.claude.options_schema.choices]]
value = "plan"
label = "Plan mode"
flag_args = ["--permission-mode", "plan"]

[[providers.claude.options_schema]]
key = "effort"
label = "Effort"
type = "select"
default = "max"

[[providers.claude.options_schema.choices]]
value = "low"
label = "Low"
flag_args = ["--effort", "low"]

[[providers.claude.options_schema.choices]]
value = "medium"
label = "Medium"
flag_args = ["--effort", "medium"]

[[providers.claude.options_schema.choices]]
value = "high"
label = "High"
flag_args = ["--effort", "high"]

[[providers.claude.options_schema.choices]]
value = "xhigh"
label = "Extra High"
flag_args = ["--effort", "xhigh"]

[[providers.claude.options_schema.choices]]
value = "max"
label = "Max"
flag_args = ["--effort", "max"]

[[providers.claude.options_schema]]
key = "model"
label = "Model"
type = "select"
default = "opus-5-5"

[[providers.claude.options_schema.choices]]
value = "opus-5-5"
label = "Claude Opus 5.5"
flag_args = ["--model", "claude-opus-5-5"]

[[providers.claude.options_schema.choices]]
value = "fable-5"
label = "Claude Fable 5"
flag_args = ["--model", "claude-fable-5"]

[[providers.claude.options_schema.choices]]
value = "haiku-4-5"
label = "Claude Haiku 4.5"
flag_args = ["--model", "claude-haiku-4-5-20251001"]

[[providers.claude.options_schema.choices]]
value = "sonnet-5"
label = "Claude Sonnet 5"
flag_args = ["--model", "claude-sonnet-5"]

[[providers.claude.options_schema]]
key = "worktree_access"
label = "Additional worktree access"
type = "select"
default = "none"

[[providers.claude.options_schema.choices]]
value = "none"
label = "Current workdir only"
flag_args = []

[[providers.claude.options_schema.choices]]
value = "hpfetcher-worktrees"
label = "HPFetcher worktrees"
flag_args = ["--add-dir", "/home/loucmane/dev/hpfetcher-worktrees"]

[[providers.claude.options_schema.choices]]
value = "template-worktrees-and-git-metadata"
label = "Template worktrees and Git metadata"
flag_args = ["--add-dir", "/home/loucmane/gas-city-template-worktrees", "--add-dir", "/home/loucmane/gas-city-template/.git"]
