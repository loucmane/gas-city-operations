# Dedicated Core signing provider. The wrapper removes the Claude-family
# generated shared settings file, loads no ambient setting sources, and then
# applies only the source-bound closed policy selected below. Both initial and
# resumed sessions therefore cross the same subscription and policy boundary.
[providers.claude-signing]
base = "provider:claude"
command = "/home/loucmane/gas-city-template/bin/gct-claude-signing-worker"
resume_command = "/home/loucmane/gas-city-template/bin/gct-claude-signing-worker --resume {{.SessionKey}}"
path_check = "/home/loucmane/gascity/bin/claude"
options_schema_merge = "by_key"

[[providers.claude-signing.options_schema]]
key = "managed_worktree_access"
label = "Managed Core signing worktree access"
type = "select"
default = "none"

[[providers.claude-signing.options_schema.choices]]
value = "none"
label = "Current workdir only"
flag_args = []

[[providers.claude-signing.options_schema.choices]]
value = "<MANAGED_CHOICE>"
label = "gascity worktrees and Git metadata under the signing control policy"
flag_args = ["--settings", "<TEMPLATE_ROOT>/templates/claude/core-signing-control-policy.json", "--add-dir", "<CORE_WORKTREE_ROOT>", "--add-dir", "<CORE_REPOSITORY>/.git"]

[[providers.claude-signing.options_schema]]
key = "permission_mode"
label = "Permission Mode"
type = "select"
default = "full-auto"

[[providers.claude-signing.options_schema.choices]]
value = "full-auto"
label = "Fail instead of asking"
flag_args = ["--permission-mode", "dontAsk"]

[[providers.claude-signing.options_schema]]
key = "effort"
label = "Effort"
type = "select"
default = "max"

[[providers.claude-signing.options_schema.choices]]
value = "max"
label = "Max"
flag_args = ["--effort", "max"]

[[patches.agent]]
dir = "gascity"
name = "implementation-worker"
provider = "claude-signing"
[patches.agent.option_defaults]
model = "opus-5-5"
permission_mode = "full-auto"
managed_worktree_access = "<MANAGED_CHOICE>"

[patches.agent.env]
GOROOT = "/home/loucmane/.local/share/go/1.26.7"
GOTOOLCHAIN = "local"
PATH = "/home/loucmane/.local/share/go/1.26.7/bin:/home/loucmane/gascity/bin:/usr/local/bin:/usr/bin:/bin"
