# Generated by gct-managed-rig-permissions; do not edit.
# registry_sha256=<REGISTRY_SHA256>
# The production city owns [providers.codex]. gc's include composition keeps
# the first provider schema it sees, so managed grants must ride a derived
# provider whose name the root never declares. The patch selects the precise
# no-vault choice emitted for its registry record.
[providers.codex-managed]
base = "provider:codex"
options_schema_merge = "by_key"

[[providers.codex-managed.options_schema]]
key = "worklog_access"
label = "Managed rig worktree access"
type = "select"
default = "none"

[[providers.codex-managed.options_schema.choices]]
value = "none"
label = "Current workdir only"
flag_args = []

[[providers.codex-managed.options_schema.choices]]
value = "<MANAGED_CHOICE>"
label = "gascity worktrees and Git metadata (no vault)"
flag_args = ["--sandbox", "workspace-write", "-c", "sandbox_workspace_write.writable_roots=[\"<CORE_WORKTREE_ROOT>\",\"<CORE_REPOSITORY>/.git\"]"]

# Dedicated Operations candidate provider. The wrapper removes the Claude-family
# generated shared settings file, loads no ambient setting sources, and then
# applies only the source-bound closed candidate policy selected below. Both
# initial and resumed sessions therefore cross the same subscription and policy
# boundary as the Core signing worker, without any signing capability.
[providers.claude-candidate]
base = "provider:claude"
command = "/home/loucmane/gas-city-template/bin/gct-claude-candidate-worker"
resume_command = "/home/loucmane/gas-city-template/bin/gct-claude-candidate-worker --resume {{.SessionKey}}"
path_check = "/home/loucmane/gascity/bin/claude"
options_schema_merge = "by_key"

[[providers.claude-candidate.options_schema]]
key = "managed_worktree_access"
label = "Managed Operations candidate worktree access"
type = "select"
default = "none"

[[providers.claude-candidate.options_schema.choices]]
value = "none"
label = "Current workdir only"
flag_args = []

[[providers.claude-candidate.options_schema.choices]]
value = "<MANAGED_CHOICE>"
label = "gascity worktrees under the candidate control policy"
flag_args = ["--settings", "<TEMPLATE_ROOT>/templates/claude/candidate-control-policy.json", "--add-dir", "<OPERATIONS_WORKTREE_ROOT>"]

[[providers.claude-candidate.options_schema]]
key = "permission_mode"
label = "Permission Mode"
type = "select"
default = "full-auto"

[[providers.claude-candidate.options_schema.choices]]
value = "full-auto"
label = "Fail instead of asking"
flag_args = ["--permission-mode", "dontAsk"]

[[providers.claude-candidate.options_schema]]
key = "effort"
label = "Effort"
type = "select"
default = "max"

[[providers.claude-candidate.options_schema.choices]]
value = "max"
label = "Max"
flag_args = ["--effort", "max"]

[[patches.agent]]
dir = "gascity"
name = "operations-candidate-worker"
provider = "claude-candidate"
[patches.agent.option_defaults]
model = "opus-5-5"
permission_mode = "full-auto"
